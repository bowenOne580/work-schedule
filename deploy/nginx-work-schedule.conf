# Work Schedule 生产环境 Nginx 配置（nginx 托管静态文件 + API 反代）
# 安装：
#   sudo cp deploy/nginx-work-schedule.conf /etc/nginx/sites-available/work-schedule
#   sudo ln -sf /etc/nginx/sites-available/work-schedule /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 按服务器实际情况修改 server_name 与 root 路径。
# 注意：与项目根目录的 nginx.conf（开发调试用，反代 Vite 5173）不同，
#       本配置直接托管 frontend/dist 构建产物，5173 不再参与生产。

server {
    listen 80;
    server_name todo.wbwone1.cn;

    root /opt/work-schedule/frontend/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的资源：一年长缓存，文件名变化自动失效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 入口不做长缓存，保证发版后能取到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
