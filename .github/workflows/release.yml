name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Package release zip
        run: |
          zip -r work-schedule-${{ github.ref_name }}.zip . \
            --exclude "*.git*" \
            --exclude "frontend/node_modules/*" \
            --exclude "node_modules/*" \
            --exclude "data/*" \
            --exclude "auth.json" \
            --exclude ".env"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: work-schedule-${{ github.ref_name }}.zip
          generate_release_notes: true
